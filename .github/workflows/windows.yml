name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Validate high-resolution portrait
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'assets/interviewer.webp').Path)
          if ($bytes.Length -lt 7000) { throw 'Portrait too small or corrupted' }
          $magic = [System.Text.Encoding]::ASCII.GetString($bytes, 0, 4)
          $format = [System.Text.Encoding]::ASCII.GetString($bytes, 8, 4)
          if ($magic -ne 'RIFF' -or $format -ne 'WEBP') { throw 'Invalid WebP portrait' }
          Write-Host "Verified WebP portrait: $($bytes.Length) bytes"

      - name: Build Windows EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Python-Junior-Mock-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
