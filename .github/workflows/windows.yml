name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Render and validate real Electron PDF (graded and unfinished)
        run: npm run test:pdf
        timeout-minutes: 4
      - name: Verify QuickCue light/dark desktop UI and original iOS icon
        run: npm run test:ui
        timeout-minutes: 4
      - name: Upload desktop UI previews
        uses: actions/upload-artifact@v4
        with:
          name: QuickCue-Desktop-UI-previews
          path: ui-preview/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Validate high-resolution portrait
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'assets/interviewer.webp').Path)
          if ($bytes.Length -lt 7000) { throw 'Portrait too small or corrupted' }
          $magic = [System.Text.Encoding]::ASCII.GetString($bytes, 0, 4)
          $format = [System.Text.Encoding]::ASCII.GetString($bytes, 8, 4)
          if ($magic -ne 'RIFF' -or $format -ne 'WEBP') { throw 'Invalid WebP portrait' }
          Write-Host "Verified WebP portrait: $($bytes.Length) bytes"

      - name: Validate generated Windows icon
        shell: pwsh
        run: |
          npm run icon
          $bytes = [System.IO.File]::ReadAllBytes('assets/quickcue-app-icon.ico')
          if ($bytes.Length -lt 10000) { throw 'Invalid Windows ICO size' }
          if ($bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) { throw 'Invalid ICO magic' }
          if ($bytes[4] -ne 7) { throw 'Missing icon resolutions' }
          Write-Host "QuickCue original iOS icon packed into Windows ICO"
      - name: Build Windows EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Python-Junior-Mock-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
