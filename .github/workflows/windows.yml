name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Validate portrait JPEG
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Image]::FromFile((Resolve-Path 'assets/interviewer.jpg').Path)
          try {
            if ($image.Width -lt 250 -or $image.Height -lt 250) { throw 'Portrait resolution is too small' }
            Write-Host "Portrait JPEG loaded: $($image.Width)x$($image.Height)"
          } finally { $image.Dispose() }
      - name: Build Windows EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Python-Junior-Mock-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
